<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mapa de ayuda — Cali</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --ink: #1c2b24; --paper: #f6f5f1; --line: #d8d5cc;
    --necesidad: #d1372b; --donacion: #2f9e44;
    --albergue: #2d5f8a; --acopio: #b8860b; --colapso: #6b2f42;
    --panel-w: 340px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--paper); color: var(--ink);
    display: flex; flex-direction: column;
  }

  header {
    padding: 10px 14px; border-bottom: 1px solid var(--line); background: #fff;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 1.05rem; }
  header p { margin: 0; font-size: 0.75rem; color: #5c6b62; }

  .filtros {
    display: flex; gap: 6px; padding: 8px 10px; background: #fff; border-bottom: 1px solid var(--line);
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .filtro-chip {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
    font-size: 0.78rem; font-weight: 600; background: #fff; cursor: pointer; user-select: none;
    color: #5c6b62; white-space: nowrap; transition: background .15s, color .15s, border-color .15s;
  }
  .filtro-chip .dot { width: 9px; height: 9px; border-radius: 50%; }
  .filtro-chip.activo { color: #fff; }

  .main { flex: 1; display: flex; min-height: 0; position: relative; }
  #mapa { flex: 1; min-height: 0; }

  /* --- Panel lateral (desktop/tablet) --- */
  .panel {
    width: var(--panel-w); flex: 0 0 auto; border-left: 1px solid var(--line);
    background: #fff; overflow-y: auto; padding: 14px;
  }

  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
  .stat { border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .stat .n { font-size: 1.2rem; font-weight: 700; }
  .stat .l { font-size: 0.68rem; color: #5c6b62; text-transform: uppercase; letter-spacing: .03em; }

  h2 { font-size: 0.85rem; margin: 16px 0 8px; }
  .match { border: 1px solid var(--line); border-radius: 8px; padding: 9px; margin-bottom: 7px; font-size: 0.82rem; }
  .match .cand { padding: 3px 0; border-top: 1px dashed var(--line); }
  .badge { display: inline-block; font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; color: #fff; text-transform: uppercase; }

  /* --- Botones flotantes de reporte (rojo/verde) --- */
  .fab-bar {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 12px;
    display: flex; gap: 10px; pointer-events: none;
  }
  .fab {
    pointer-events: all; flex: 1; max-width: 220px; padding: 13px; border: none; border-radius: 10px;
    font-weight: 700; font-size: 0.9rem; color: #fff; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.18);
  }
  .fab.necesidad { background: var(--necesidad); }
  .fab.donacion { background: var(--donacion); }

  /* --- Modal de registro --- */
  .overlay {
    display: none; position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 1000;
    align-items: flex-end; justify-content: center; pointer-events: none;
  }
  .overlay.abierto { display: flex; }
  .modal {
    pointer-events: auto; background: #fff; width: 100%; max-width: 460px; border-radius: 16px 16px 0 0;
    padding: 18px 18px 22px; max-height: 60vh; overflow-y: auto;
    box-shadow: 0 -8px 24px rgba(0,0,0,.18); border-top: 1px solid var(--line);
  }
  .modal-cabecera { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .modal-cabecera h3 { margin: 0; font-size: 1.05rem; }
  .cerrar { border: none; background: none; font-size: 1.3rem; cursor: pointer; color: #8a8f89; line-height: 1; padding: 4px; }
  .modal .tipo-tag { display: inline-block; font-size: .7rem; font-weight: 700; padding: 3px 8px; border-radius: 5px; color: #fff; margin-bottom: 10px; }

  form label { display: block; font-size: 0.78rem; font-weight: 600; margin: 10px 0 4px; }
  form select, form input, form textarea {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 7px; font-size: 0.9rem; font-family: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }
  .hint { font-size: 0.75rem; color: #8a8f89; margin-top: 6px; }
  .btn-enviar { width: 100%; margin-top: 16px; padding: 12px; border: none; border-radius: 8px; font-weight: 700; color: #fff; font-size: 0.95rem; cursor: pointer; }

  /* ---------- Responsive layout ---------- */
  /* Mobile por defecto: panel oculto, se ve como pestaña deslizable */
  .panel { display: none; }
  .toggle-panel {
    position: absolute; top: 10px; right: 10px; z-index: 500;
    background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
    font-size: 0.8rem; font-weight: 700; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  .panel.abierto {
    display: block; position: absolute; inset: 0; z-index: 600;
  }

  @media (min-width: 760px) {
    .main { position: relative; }
    .panel { display: block; position: static; }
    .toggle-panel { display: none; }
    .fab-bar { max-width: none; }
  }
  @media (min-width: 760px) and (max-width: 1023px) {
    :root { --panel-w: 300px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Mapa de ayuda — Cali</h1>
    <p>Terremoto Valle del Cauca, agosto 2026 · reporta o encuentra ayuda cerca de ti</p>
  </div>
</header>

<div class="filtros" id="filtros"></div>

<div class="main">
  <div style="position:relative; flex:1; min-height:0;">
    <div id="mapa" style="height:100%;"></div>
    <button class="toggle-panel" id="botonPanel">Ver panel ▲</button>
    <div class="fab-bar">
      <button class="fab necesidad" data-tipo="necesidad">🔴 Reportar necesidad</button>
      <button class="fab donacion" data-tipo="donacion">🟢 Ofrecer ayuda</button>
    </div>
  </div>

  <div class="panel" id="panel">
    <div class="stats" id="stats"></div>
    <h2>Emparejamientos sugeridos</h2>
    <div id="matches"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-cabecera">
      <h3 id="modalTitulo">Reportar</h3>
      <button class="cerrar" id="cerrarModal">✕</button>
    </div>
    <span class="tipo-tag" id="tipoTag"></span>

    <form id="formulario">
      <input type="hidden" id="tipo">
      <label>Nombre / referencia</label>
      <input id="nombre" required placeholder="Ej: Barrio Siloé, cuadra 4">

      <label>Categoría</label>
      <select id="categoria">
        <option>Agua</option><option>Alimentos</option><option>Ropa / cobijas</option>
        <option>Medicamentos</option><option>Refugio</option><option>Transporte</option>
        <option>Rescate</option><option>General</option>
      </select>

      <label>Detalle</label>
      <textarea id="detalle" rows="2" placeholder="Cantidad, urgencia, etc."></textarea>

      <label>Contacto (teléfono / WhatsApp)</label>
      <input id="contacto" placeholder="Ej: 300 000 0000">

      <label>Ubicación</label>
      <p class="hint" id="pinHint">Toca el mapa (arriba del formulario) donde corresponde — el pin aparece al instante y puedes arrastrarlo para ajustarlo.</p>

      <button type="submit" class="btn-enviar" id="botonEnviar">Enviar</button>
    </form>
  </div>
</div>

<script>
const API = "";
const COLORES = { necesidad: "#d1372b", donacion: "#2f9e44", albergue: "#2d5f8a", acopio: "#b8860b", colapso: "#6b2f42" };
const ETIQUETAS = { necesidad: "Necesidad", donacion: "Donación", albergue: "Albergue", acopio: "Acopio", colapso: "Colapso" };

// Filtros: acopio/albergue/colapso son capas informativas que se pueden apagar.
// Necesidad y donación siempre están activas (son la razón de ser del mapa).
const FILTRABLES = ["albergue", "acopio", "colapso"];
let filtrosActivos = new Set(FILTRABLES); // todos visibles por defecto

const filtrosEl = document.getElementById("filtros");
filtrosEl.innerHTML = FILTRABLES.map(tipo => `
  <div class="filtro-chip activo" data-tipo="${tipo}" style="border-color:${COLORES[tipo]}; background:${COLORES[tipo]}">
    <span class="dot" style="background:#fff"></span>${ETIQUETAS[tipo]}
  </div>
`).join("");

filtrosEl.querySelectorAll(".filtro-chip").forEach(chip => {
  chip.addEventListener("click", () => {
    const tipo = chip.dataset.tipo;
    if (filtrosActivos.has(tipo)) {
      filtrosActivos.delete(tipo);
      chip.classList.remove("activo");
      chip.style.background = "#fff";
      chip.style.color = "#5c6b62";
    } else {
      filtrosActivos.add(tipo);
      chip.classList.add("activo");
      chip.style.background = COLORES[tipo];
      chip.style.color = "#fff";
    }
    cargarPuntos();
  });
});

// --- Mapa enfocado en Cali ---
const mapa = L.map("mapa", { zoomControl: true }).setView([3.4516, -76.5320], 12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap contributors", maxZoom: 19
}).addTo(mapa);

let capaMarcadores = L.layerGroup().addTo(mapa);
let pinNuevo = null;
let coordsNuevo = null;
let tipoSeleccionado = null;

function iconoColor(tipo) {
  return L.divIcon({
    className: "",
    html: `<div style="width:16px;height:16px;border-radius:50%;background:${COLORES[tipo]};border:2px solid #fff;box-shadow:0 0 2px rgba(0,0,0,.4)"></div>`,
    iconSize: [16, 16],
  });
}

mapa.on("click", (e) => {
  if (!tipoSeleccionado) return; // solo se marca pin si hay un reporte en curso
  coordsNuevo = e.latlng;
  if (pinNuevo) pinNuevo.setLatLng(coordsNuevo);
  else pinNuevo = L.marker(coordsNuevo, { draggable: true, icon: iconoColor(tipoSeleccionado) }).addTo(mapa);
  pinNuevo.on("dragend", () => { coordsNuevo = pinNuevo.getLatLng(); actualizarHintUbicacion(); });
  actualizarHintUbicacion();
});

function actualizarHintUbicacion() {
  document.getElementById("pinHint").textContent =
    `Punto marcado: ${coordsNuevo.lat.toFixed(5)}, ${coordsNuevo.lng.toFixed(5)}. Puedes arrastrarlo para ajustar.`;
}

async function cargarPuntos() {
  const res = await fetch(`${API}/api/puntos`);
  const puntos = await res.json();

  capaMarcadores.clearLayers();
  for (const p of puntos) {
    if (FILTRABLES.includes(p.tipo) && !filtrosActivos.has(p.tipo)) continue;

    const marcador = L.marker([p.lat, p.lng], { icon: iconoColor(p.tipo) });
    const puedeAbastecer = ["necesidad", "donacion"].includes(p.tipo) && p.estado === "pendiente";
    marcador.bindPopup(`
      <b>${ETIQUETAS[p.tipo]}</b> — ${p.nombre}<br>
      ${p.categoria} · ${p.estado}<br>
      ${p.detalle ? p.detalle + "<br>" : ""}
      ${p.contacto ? "Contacto: " + p.contacto + "<br>" : ""}
      ${puedeAbastecer ? `<button onclick="marcarAbastecido('${p.id}')">Marcar abastecido</button>` : ""}
    `);
    marcador.addTo(capaMarcadores);
  }
}

async function marcarAbastecido(id) {
  await fetch(`${API}/api/puntos/${id}/estado`, {
    method: "PATCH", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ estado: "abastecido" }),
  });
  cargarPuntos(); cargarStats();
}
window.marcarAbastecido = marcarAbastecido;

async function cargarStats() {
  const res = await fetch(`${API}/api/estadisticas`);
  const stats = await res.json();
  document.getElementById("stats").innerHTML = Object.entries(stats).map(([tipo, s]) => `
    <div class="stat">
      <div class="n" style="color:${COLORES[tipo]}">${s.total}</div>
      <div class="l">${ETIQUETAS[tipo]}${s.abastecido ? ` · ${s.abastecido} abastecidas` : ""}</div>
    </div>
  `).join("");
}

async function cargarMatches() {
  const res = await fetch(`${API}/api/emparejamientos`);
  const data = await res.json();
  const el = document.getElementById("matches");
  if (!data.length) { el.innerHTML = `<p class="hint">No hay necesidades pendientes por ahora.</p>`; return; }
  el.innerHTML = data.map(m => `
    <div class="match">
      <span class="badge" style="background:${COLORES.necesidad}">Necesidad</span>
      <b>${m.necesidad_nombre}</b> (${m.categoria})
      ${m.candidatas.length
        ? m.candidatas.slice(0, 3).map(c => `<div class="cand">↳ ${c.nombre} — ${c.distancia_km} km — ${c.contacto || "sin contacto"}</div>`).join("")
        : `<div class="cand">Sin donaciones disponibles de esta categoría aún.</div>`}
    </div>
  `).join("");
}

// --- Panel deslizable en móvil ---
const panel = document.getElementById("panel");
const botonPanel = document.getElementById("botonPanel");
botonPanel.addEventListener("click", () => {
  panel.classList.toggle("abierto");
  botonPanel.textContent = panel.classList.contains("abierto") ? "Ver mapa ▼" : "Ver panel ▲";
});

// --- Modal de reporte (rojo = necesidad, verde = donación) ---
const overlay = document.getElementById("overlay");
document.querySelectorAll(".fab").forEach(boton => {
  boton.addEventListener("click", () => {
    tipoSeleccionado = boton.dataset.tipo;
    document.getElementById("tipo").value = tipoSeleccionado;
    document.getElementById("modalTitulo").textContent =
      tipoSeleccionado === "necesidad" ? "Reportar necesidad" : "Ofrecer ayuda";
    const tag = document.getElementById("tipoTag");
    tag.textContent = ETIQUETAS[tipoSeleccionado];
    tag.style.background = COLORES[tipoSeleccionado];
    document.getElementById("botonEnviar").style.background = COLORES[tipoSeleccionado];
    if (!coordsNuevo) document.getElementById("pinHint").textContent =
      "Toca el mapa (arriba del formulario) donde corresponde — el pin aparece al instante y puedes arrastrarlo para ajustarlo.";
    overlay.classList.add("abierto");
  });
});
document.getElementById("cerrarModal").addEventListener("click", () => overlay.classList.remove("abierto"));

document.getElementById("formulario").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!coordsNuevo) { alert("Marca la ubicación en el mapa antes de enviar (cierra este panel, toca el mapa, y vuelve a abrir el formulario)."); return; }

  await fetch(`${API}/api/puntos`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      tipo: tipoSeleccionado,
      nombre: document.getElementById("nombre").value,
      categoria: document.getElementById("categoria").value,
      detalle: document.getElementById("detalle").value,
      contacto: document.getElementById("contacto").value,
      lat: coordsNuevo.lat, lng: coordsNuevo.lng,
    }),
  });

  e.target.reset();
  overlay.classList.remove("abierto");
  if (pinNuevo) { mapa.removeLayer(pinNuevo); pinNuevo = null; coordsNuevo = null; }
  tipoSeleccionado = null;
  cargarPuntos(); cargarStats(); cargarMatches();
});

cargarPuntos(); cargarStats(); cargarMatches();
setInterval(() => { cargarPuntos(); cargarStats(); cargarMatches(); }, 15000);
</script>
</body>
</html>
